<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Bar Gradient 1 -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Bar Gradient 2 -->
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-dot {
        animation: pulse 3s infinite alternate ease-in-out;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      .floating-pill {
        animation: floatAnim 6s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.95); }
        100% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Geometric Grid Background (Low Opacity) -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Animated Ambient Glowing Orbs (Deep Background) -->
  <circle cx="950" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-dot" />
  <circle cx="1100" cy="80" r="90" fill="#38bdf8" opacity="0.18" filter="url(#glow)" class="pulse-dot" />

  <!-- Animated Data Flow Lines (Background Right Side) -->
  <path d="M 700 280 C 800 220, 850 310, 960 210 S 1080 180, 1160 120" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.35" class="flow-line" />
  <path d="M 720 310 C 820 270, 880 200, 990 230 S 1090 120, 1180 80" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.25" class="flow-line" />

  <!-- Dynamic Analytics Visual Graphics (Right Panel - Subtle) -->
  <g transform="translate(800, 120)" opacity="0.85" class="floating-pill">
    <!-- Chart Backing Card -->
    <rect x="0" y="0" width="340" height="190" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" />
    
    <!-- Mini BI Bar Chart in Background Card -->
    <rect x="25" y="110" width="22" height="50" rx="4" fill="url(#barGrad1)" />
    <rect x="57" y="80" width="22" height="80" rx="4" fill="url(#barGrad2)" />
    <rect x="89" y="55" width="22" height="105" rx="4" fill="url(#barGrad1)" />
    <rect x="121" y="90" width="22" height="70" rx="4" fill="url(#barGrad2)" />
    <rect x="153" y="40" width="22" height="120" rx="4" fill="url(#barGrad1)" />
    <rect x="185" y="65" width="22" height="95" rx="4" fill="url(#barGrad2)" />
    <rect x="217" y="30" width="22" height="130" rx="4" fill="url(#barGrad1)" />

    <!-- Trend Line -->
    <path d="M 36 100 Q 100 50, 164 35 T 228 25" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="228" cy="25" r="4.5" fill="#38bdf8" filter="url(#glow)" />

    <!-- Mini KPI Stat Badge -->
    <rect x="250" y="25" width="75" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="258" y="42" font-family="sans-serif" font-size="10" fill="#94a3b8">ROI TRACK</text>
    <text x="258" y="59" font-family="sans-serif" font-weight="700" font-size="14" fill="#34d399">+342%</text>

    <!-- Mini Conversion Metric Badge -->
    <rect x="250" y="80" width="75" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="258" y="97" font-family="sans-serif" font-size="10" fill="#94a3b8">ATTRIBUTION</text>
    <text x="258" y="114" font-family="sans-serif" font-weight="700" font-size="14" fill="#60a5fa">Multi-Touch</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges, Subtitles (Always Crisp and Clear) -->
  <g transform="translate(70, 70)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" />
      <text x="28" y="19" class="badge-text" fill="#38bdf8">CURATED ECOSYSTEM • MARCH 2026</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="70" class="title-text">
      Awesome Marketing Analytics &amp; BI
    </text>

    <!-- Accent Horizontal Line -->
    <rect x="0" y="90" width="580" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="130" class="subtitle-text">
      The authoritative guide to Marketing Data Integration, Multi-Touch Attribution,
    </text>
    <text x="0" y="156" class="subtitle-text">
      Ad Spend Aggregation, and Self-Hosted Business Intelligence platforms.
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="125" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" class="badge-text">⚡ SaaS Tools</text>

      <!-- Pill 2 -->
      <rect x="135" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="149" y="20" class="badge-text">🔓 Open-Source BI</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="324" y="20" class="badge-text">📊 ETL &amp; Pipelines</text>

      <!-- Pill 4 -->
      <rect x="485" y="0" width="155" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="499" y="20" class="badge-text">🎯 Attribution &amp; ROI</text>
    </g>
  </g>
</svg>
